name: News Cron

on:
  schedule:
    # Tehran is UTC+03:30 all year (Iran abolished DST in 2022).
    # 08:00 Tehran -> 04:30 UTC
    # 12:00 Tehran -> 08:30 UTC
    # 16:00 Tehran -> 12:30 UTC
    # 20:00 Tehran -> 16:30 UTC
    # 00:00 Tehran -> 20:30 UTC (previous UTC day)
    - cron: "30 4,8,12,16,20 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Summarize without sending (Render returns a preview report)"
        type: boolean
        default: false

concurrency:
  group: news-cron
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Wake Render and wait for health
        env:
          BASE_URL: ${{ secrets.RENDER_BASE_URL }}
        run: |
          if [ -z "$BASE_URL" ]; then
            echo "::error::Set the RENDER_BASE_URL secret, e.g. https://my-bot.onrender.com"
            exit 1
          fi
          for attempt in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 "$BASE_URL/health" || true)
            echo "attempt=$attempt health_http=$code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 10
          done
          echo "::error::Render did not become healthy in time"
          exit 1

      - name: Trigger news run
        env:
          BASE_URL: ${{ secrets.RENDER_BASE_URL }}
          TRIGGER_TOKEN: ${{ secrets.TRIGGER_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          if [ -z "$TRIGGER_TOKEN" ]; then
            echo "::error::Set the TRIGGER_TOKEN secret (must match Render's TRIGGER_TOKEN)."
            exit 1
          fi
          set +e
          response=$(curl -sS --max-time 300 -w '\n%{http_code}' \
            -X POST "$BASE_URL/trigger_news?wait=1" \
            -H "Authorization: Bearer $TRIGGER_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"dry_run\": $DRY_RUN}")
          status=$?
          http=$(printf '%s' "$response" | tail -n1)
          body=$(printf '%s' "$response" | sed '$d')
          echo "curl_exit=$status http=$http"
          echo "body=$body"
          if [ "$status" -ne 0 ] || [ "$http" != "200" ]; then
            echo "::error::News trigger failed (http=$http)"
            exit 1
          fi
