name: News Cron

on:
  schedule:
    # Backup trigger. The Render process also has its own in-process scheduler,
    # so this only helps when Render is already awake. Tehran is UTC+03:30 all
    # year: 08:00->04:30Z, 12:00->08:30Z, 16:00->12:30Z, 20:00->16:30Z, 00:00->20:30Z.
    - cron: "35 4,8,12,16,20 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Summarize without sending (Render returns a preview report)"
        type: boolean
        default: false

concurrency:
  group: news-cron
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Wake Render and wait for health
        env:
          BASE_URL: ${{ secrets.RENDER_BASE_URL }}
        run: |
          if [ -z "$BASE_URL" ]; then
            echo "::error::Set the RENDER_BASE_URL secret, e.g. https://my-bot.onrender.com"
            exit 1
          fi
          for attempt in $(seq 1 18); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 45 "$BASE_URL/health" || true)
            echo "attempt=$attempt health_http=$code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 8
          done
          echo "::warning::Render did not wake in time; the in-process scheduler will cover this slot"
          exit 0

      - name: Trigger news run (slot-aware)
        env:
          BASE_URL: ${{ secrets.RENDER_BASE_URL }}
          TRIGGER_TOKEN: ${{ secrets.TRIGGER_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          if [ -z "$TRIGGER_TOKEN" ]; then
            echo "::error::Set the TRIGGER_TOKEN secret (must match Render's TRIGGER_TOKEN)."
            exit 1
          fi
          set +e
          response=$(curl -sS --max-time 300 -w '\n%{http_code}' \
            -X POST "$BASE_URL/trigger_news?wait=1" \
            -H "Authorization: Bearer $TRIGGER_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"dry_run\": $DRY_RUN}")
          status=$?
          http=$(printf '%s' "$response" | tail -n1)
          body=$(printf '%s' "$response" | sed '$d')
          echo "curl_exit=$status http=$http"
          echo "body=$body"
          if [ "$status" -ne 0 ] || [ "$http" != "200" ]; then
            echo "::warning::Backup trigger did not run (http=$http); the in-process scheduler remains primary"
            exit 0
          fi
