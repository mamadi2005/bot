name: News Cron

on:
  schedule:
    # External event trigger; slot-aware delivery runs at most once per slot.
    # In NEWS_TEST_MODE it sends one historical item per 5-minute interval.
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Summarize without sending; details appear in Render logs"
        type: boolean
        default: false

concurrency:
  group: news-cron
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Wake Render and wait for health
        env:
          BASE_URL: ${{ secrets.RENDER_BASE_URL }}
        run: |
          if [ -z "$BASE_URL" ]; then
            echo "::error::Set the RENDER_BASE_URL secret, e.g. https://my-bot.onrender.com"
            exit 1
          fi
          for attempt in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$BASE_URL/health" || true)
            echo "attempt=$attempt health_http=$code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 10
          done
          echo "::warning::Render did not wake in time"
          exit 0

      - name: Trigger news run and wait for completion
        env:
          BASE_URL: ${{ secrets.RENDER_BASE_URL }}
          TRIGGER_TOKEN: ${{ secrets.TRIGGER_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          if [ -z "$TRIGGER_TOKEN" ]; then
            echo "::error::Set the TRIGGER_TOKEN secret (must match Render's TRIGGER_TOKEN)."
            exit 1
          fi
          response=$(curl -sS --max-time 30 -w '\n%{http_code}' \
            -X POST "$BASE_URL/trigger_news" \
            -H "Authorization: Bearer $TRIGGER_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"dry_run\": $DRY_RUN}")
          http=$(printf '%s' "$response" | tail -n1)
          body=$(printf '%s' "$response" | sed '$d')
          echo "trigger_http=$http body=$body"
          if [ "$http" != "202" ]; then
            echo "::error::News trigger failed (http=$http)"
            exit 1
          fi
          for attempt in $(seq 1 60); do
            status=$(curl -sS --max-time 20 \
              -H "Authorization: Bearer $TRIGGER_TOKEN" \
              "$BASE_URL/news_status")
            echo "status_attempt=$attempt status=$status"
            running=$(printf '%s' "$status" | jq -r '.running // false')
            if [ "$running" = "false" ]; then
              ok=$(printf '%s' "$status" | jq -r '.last_result.ok // false')
              if [ "$ok" = "true" ]; then exit 0; fi
              echo "::error::News job finished with an error"
              exit 1
            fi
            sleep 5
          done
          echo "::error::News job did not finish within five minutes"
          exit 1
