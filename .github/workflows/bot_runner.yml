name: Security Intelligence Bot

on:
  schedule:
    # Every 4 hours (UTC). GitHub runs cron on a best-effort basis.
    - cron: "0 */4 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Fetch + summarize without sending or saving state"
        type: boolean
        default: false

concurrency:
  group: security-intel-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install PDF system libraries
        if: ${{ vars.ENABLE_PDF == 'true' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf-2.0-0

      - name: Check Vazirmatn fonts
        if: ${{ vars.ENABLE_PDF == 'true' }}
        run: |
          if [ ! -f assets/fonts/Vazirmatn-Regular.ttf ]; then
            echo "::warning::Vazirmatn-Regular.ttf is missing; the PDF step will be skipped."
          fi

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          TZ: Asia/Tehran
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ENABLE_PDF: ${{ vars.ENABLE_PDF || 'false' }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          DEBUG: ${{ vars.DEBUG || 'false' }}
        run: python main.py

      # Dedup hashes, AI counters, users and force-join channels live in data/;
      # each run commits the new snapshot so the next scheduled run sees it.
      - name: Persist state
        if: always() && (github.event_name != 'workflow_dispatch' || inputs.dry_run != true)
        run: |
          files=""
          for f in data/state.json data/users.json data/channels.json; do
            if [ -f "$f" ]; then files="$files $f"; fi
          done
          if [ -z "$files" ]; then
            echo "no data files to commit"
            exit 0
          fi
          git add $files
          if git diff --cached --quiet; then
            echo "data unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update bot state [skip ci]"
          git pull --rebase --autostash
          git push

      - name: Upload PDF digest (if generated)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-digest-pdf
          path: build/*.pdf
          if-no-files-found: ignore
          retention-days: 7
